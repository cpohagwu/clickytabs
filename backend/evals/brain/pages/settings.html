<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Settings - Lumen</title><style>
*{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,Segoe UI,Arial,sans-serif;color:#1d2330;background:#f6f7fb}
header.top{display:flex;align-items:center;gap:24px;height:60px;padding:0 32px;background:#fff;border-bottom:1px solid #e3e6ee}
header.top .logo{font-weight:700;font-size:20px;color:#3b4cca} header.top nav{display:flex;gap:20px}
a{color:#3b4cca;text-decoration:none} button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #c9cedb;background:#fff;padding:8px 16px}
button.primary{background:#3b4cca;color:#fff;border-color:#3b4cca} main{padding:32px}
.card{background:#fff;border:1px solid #e3e6ee;border-radius:12px;padding:24px}
label{display:block;font-weight:600;margin:12px 0 4px} input,select{font:inherit;padding:8px 10px;border:1px solid #c9cedb;border-radius:8px;width:100%}
</style></head><body><header class="top"><span class="logo">Lumen</span><nav><a href="#library">Library</a><a href="#settings">Settings</a></nav></header>
<main style="max-width:640px"><h1>Settings</h1><div class="card">
<p style="display:flex;justify-content:space-between"><span>Email notifications</span><button role="switch" aria-checked="true" aria-label="Email notifications">On</button></p>
<p style="display:flex;justify-content:space-between"><span>Dark mode</span><button role="switch" aria-checked="false" aria-label="Dark mode">Off</button></p>
<p style="display:flex;justify-content:space-between"><span>Automatic updates</span><button role="switch" aria-checked="true" aria-label="Automatic updates">On</button></p>
<p style="display:flex;justify-content:space-between"><span>Language</span><span>English</span></p>
</div><p><button class="primary">Save changes</button> <button>Cancel</button></p></main></body></html>
