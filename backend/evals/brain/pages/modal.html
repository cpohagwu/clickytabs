<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fresh Market - groceries delivered</title><style>
*{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,Segoe UI,Arial,sans-serif;color:#1d2330;background:#f6f7fb}
header.top{display:flex;align-items:center;gap:24px;height:60px;padding:0 32px;background:#fff;border-bottom:1px solid #e3e6ee}

<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center">

<button aria-label="Close" style="position:absolute;right:12px;top:12px">&times;</button>

<button class="primary">Claim offer</button> <button>No thanks</button></div></div></body></html>
