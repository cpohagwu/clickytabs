[project]
name = "clicky-worker"
version = "0.1.0"
description = "ClickyTabs automation worker: runs browser-use in its own environment (JSON lines over stdio)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Collins Patrick Ohagwu" }]
requires-python = ">=3.11,<3.14"
# browser-use pins exact versions (pydantic==2.13.5, ollama==0.6.1, anthropic<2), which is why this is a separate
# project instead of an extra of the backend.
dependencies = ["browser-use==0.13.14"]

[project.urls]
Homepage = "https://github.com/cpohagwu/clickytabs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clicky_worker"]
