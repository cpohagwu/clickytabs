[project]
name = "clickytabs-backend"
version = "0.1.0"
description = "ClickyTabs orchestrator: voice, model-agnostic brain, visuals and browser automation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Collins Patrick Ohagwu" }]
requires-python = ">=3.12,<3.14"          # upper bound: kokoro-onnx 0.6.x supports <3.14
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",                          # also the Ollama REST client, so plain `uv sync` runs the local brain
  "typer>=0.27",
  "rich>=15",
  "psutil>=7.2",
  "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/cpohagwu/clickytabs"

[project.optional-dependencies]
# Open-source providers: Ollama first (needs only httpx + PyAV for audio), Hugging Face as fallback.
local = ["av>=19", "huggingface-hub>=2.4"]
kokoro = ["kokoro-onnx>=0.6.1"]                                 # Kokoro-82M TTS on CPU (onnxruntime)
local-hf = ["clickytabs-backend[kokoro]", "onnx-asr>=0.12", "faster-whisper>=1.2.1"]   # Silero VAD ONNX ships inside; no torch
# Paid providers.
anthropic = ["anthropic>=2.4"]
openai = ["openai>=3.45"]
cloud = ["clickytabs-backend[anthropic,openai]"]   # speech APIs need no SDK (httpx / websockets)

[project.scripts]
clicky = "clicky.cli:app"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "pytest-timeout>=2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clicky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
markers = ["live: needs a running Ollama (run with: uv run pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",   # typographic characters in strings/comments
  "ASYNC109",                     # explicit timeout parameters are part of our async APIs
  "ASYNC220",                     # worker_client uses Popen + threads on purpose (see its docstring)
]
